<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>European Train Trip Gift - Minimalist Horizon Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom, #E8F4F8 0%, #F0F8FA 50%, #FFF5E6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        .horizon-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #2C3E50, transparent);
            transform: translateY(-50%);
            z-index: 1;
        }

        .train-silhouette {
            position: absolute;
            top: 50%;
            left: -200px;
            transform: translateY(-50%);
            z-index: 2;
            animation: trainMove 20s linear infinite;
        }

        @keyframes trainMove {
            from {
                left: -200px;
            }
            to {
                left: 100%;
            }
        }

        .train-shape {
            width: 150px;
            height: 40px;
            background: #2C3E50;
            border-radius: 4px 20px 4px 4px;
            position: relative;
            box-shadow: 0 4px 8px rgba(44, 62, 80, 0.3);
        }

        .train-shape::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            width: 12px;
            height: 12px;
            background: #2C3E50;
            border-radius: 50%;
        }

        .train-shape::after {
            content: '';
            position: absolute;
            bottom: -10px;
            right: 20px;
            width: 12px;
            height: 12px;
            background: #2C3E50;
            border-radius: 50%;
        }

        .gift-container {
            position: relative;
            z-index: 10;
            max-width: 600px;
            width: 100%;
            padding: 20px;
        }

        .gift-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 40px 100px rgba(44, 62, 80, 0.15);
            padding: 50px 45px;
            position: relative;
            animation: cardAppear 1s ease-out;
            border: 3px solid #2C3E50;
        }

        /* Ticket perforation effect on sides */
        .gift-card::before,
        .gift-card::after {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            width: 15px;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 10px,
                white 10px,
                white 12px,
                #E8F4F8 12px,
                #E8F4F8 14px
            );
        }

        .gift-card::before {
            left: -8px;
        }

        .gift-card::after {
            right: -8px;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .card-accent {
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 8px;
            background: linear-gradient(90deg, #F4D03F, #E6C336, #F4D03F);
            border-radius: 0 0 100px 100px;
            box-shadow: 0 4px 12px rgba(244, 208, 63, 0.4);
        }

        .ticket-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid #2C3E50;
        }

        .ticket-corner.top-left {
            top: 15px;
            left: 15px;
            border-right: none;
            border-bottom: none;
        }

        .ticket-corner.top-right {
            top: 15px;
            right: 15px;
            border-left: none;
            border-bottom: none;
        }

        .ticket-corner.bottom-left {
            bottom: 15px;
            left: 15px;
            border-right: none;
            border-top: none;
        }

        .ticket-corner.bottom-right {
            bottom: 15px;
            right: 15px;
            border-left: none;
            border-top: none;
        }

        .card-title {
            font-size: 42px;
            font-weight: 800;
            color: #2C3E50;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        .card-subtitle {
            font-size: 14px;
            font-weight: 600;
            color: #F4D03F;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 40px;
            padding: 8px 20px;
            background: rgba(244, 208, 63, 0.1);
            border-top: 2px solid #F4D03F;
            border-bottom: 2px solid #F4D03F;
            display: inline-block;
            width: 100%;
        }

        .train-icon {
            font-size: 64px;
            text-align: center;
            margin: 20px 0;
        }

        .gift-info {
            margin: 40px 0;
        }

        .info-block {
            margin-bottom: 30px;
            text-align: center;
        }

        .info-label {
            font-size: 12px;
            font-weight: 600;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .info-value {
            font-size: 24px;
            font-weight: 600;
            color: #2C3E50;
        }

        .info-value.large {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #F4D03F, #E6C336);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #ecf0f1, transparent);
            margin: 35px 0;
        }

        .message-box {
            background: linear-gradient(135deg, #E8F4F8, #F0F8FA);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-top: 40px;
            border-left: 5px solid #F4D03F;
        }

        .message-text {
            font-size: 18px;
            color: #2C3E50;
            font-weight: 400;
            line-height: 1.8;
            font-style: italic;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .feature {
            text-align: center;
            padding: 20px 10px;
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-text {
            font-size: 12px;
            color: #7f8c8d;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .gift-card {
                padding: 40px 30px;
            }

            .card-title {
                font-size: 36px;
            }

            .info-value.large {
                font-size: 28px;
            }

            .features-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .train-silhouette {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="horizon-line"></div>
    
    <div class="train-silhouette">
        <div class="train-shape"></div>
    </div>

    <div class="gift-container">
        <div class="gift-card">
            <div class="card-accent"></div>
            <div class="ticket-corner top-left"></div>
            <div class="ticket-corner top-right"></div>
            <div class="ticket-corner bottom-left"></div>
            <div class="ticket-corner bottom-right"></div>
            
            <div class="train-icon">🚂</div>
            <h1 class="card-title">European Journey</h1>
            <p class="card-subtitle">★ Geschenkgutschein ★</p>

            <div class="gift-info">
                <div class="info-block">
                    <div class="info-label">For</div>
                    <div class="info-value">My Dear Sister</div>
                </div>

                <div class="divider"></div>

                <div class="info-block">
                    <div class="info-label">Destination</div>
                    <div class="info-value large">Your Choice</div>
                </div>

                <div class="divider"></div>

                <div class="info-block">
                    <div class="info-label">Valid Period</div>
                    <div class="info-value">2026</div>
                </div>
            </div>

            <div class="features-grid">
                <div class="feature">
                    <div class="feature-icon">🏔️</div>
                    <div class="feature-text">Nature</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🏛️</div>
                    <div class="feature-text">Cities</div>
                </div>
                <div class="feature">
                    <div class="feature-icon">🚂</div>
                    <div class="feature-text">By Train</div>
                </div>
            </div>

            <div class="message-box">
                <p class="message-text">
                    Discover Europe at your own pace.<br>
                    Choose your destination, create your adventure.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
